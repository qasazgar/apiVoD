info:
  name: Adding a vehicle license plate
  type: http
  seq: 21

http:
  method: POST
  url: "{{Url-Dev}}services/financial/vehicles/"
  body:
    type: json
    data: |-
      {
        "title": "پژو207",
        "plate_number": "{{plate_number_car}}",
        "vehicle_type": "car"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        const plates = [
          "12/الف/123/11",
          "23/ب/456/22",
          "34/ج/789/33",
          "45/د/234/44",
          "56/س/567/55",
          "67/ص/890/66",
          "78/ط/345/77",
          "89/ظ/678/88",
          "91/ع/901/99",
          "12/ف/234/12",
          "23/ق/567/23",
          "34/ک/890/34",
          "45/گ/123/45",
          "56/ل/456/56",
          "67/م/789/67",
          "78/ن/234/78",
          "89/و/567/89",
          "91/ه/890/91",
          "12/ی/345/12",
          "23/پ/678/23",
          "34/ت/901/34",
          "45/ث/234/45",
          "56/ز/567/56",
          "67/ژ/890/67",
          "78/ش/123/78",
          "89/ع/456/89",
          "91/غ/789/91",
          "12/ک/234/12",
          "23/م/567/23"
        ];

        // index فعلی
        let index = Number(bru.getVar("plate_index") || 0);

        // اگر تمام پلاک‌ها استفاده شده باشند
        if (index >= plates.length) {
          throw new Error("تمام 30 پلاک استفاده شده‌اند. پلاک تکراری ارسال نمی‌شود.");
        }

        // انتخاب پلاک
        const selectedPlate = plates[index];

        // ذخیره پلاک برای Request
        bru.setVar("plate_number_car", selectedPlate);

        // افزایش index برای اجرای بعدی
        bru.setVar("plate_index", String(index + 1));

        console.log("Selected plate:", selectedPlate);
        console.log("Plate index:", index + 1);
    - type: after-response
      code: |-
        test("Status code is 201", () => {
          expect(res.status).to.equal(201);
        });

        test("Response time is less than 200ms", () => {
          expect(res.responseTime).to.be.below(200);
        });

        const data = res.body;

        const responseData = typeof data === "string"
          ? JSON.parse(data)
          : data;

        bru.setVar("id_plate_number_car", String(responseData.data.id));

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
