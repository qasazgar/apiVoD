info:
  name: ChooseProfile
  type: http
  seq: 2

http:
  method: POST
  url: "{{Stage_VOD}}/api/v1/user/auth/subprofiles/{{Fullaccess}}/switch/"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9
    - name: authorization
      value: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..2uZVMj01x8HpshylNZksIsvDugs1zXzJuaO85LdYHsE4znPVeRhx4dy6JVFx4RLukjV8pkivOt30kKzo_0K4gQ
    - name: content-length
      value: "0"
    - name: origin
      value: https://dotnama-stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotnama-stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
