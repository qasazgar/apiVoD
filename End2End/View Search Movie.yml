info:
  name: View Search Movie
  type: http
  seq: 7

http:
  method: GET
  url: "{{Stage_VOD}}/api/v1/search/?q=b"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9
    - name: authorization
      value: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..ySBU-cL1rDWFdTeKz1xbNQafXq4cbrzCLaRBfLWuGn9nkFE1rJjdNPF6MWTBqJtItktnavGFGq5MYUJf4U73uw
    - name: origin
      value: https://dotnama-stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotnama-stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36
  params:
    - name: q
      value: b
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const jsonData = res.body;

        test("Search is done", () => {
          expect(res.status).to.equal(200);
        });

        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

        if (jsonData?.movies?.length > 0) {
          const randomMovie = jsonData.movies[Math.floor(Math.random() * jsonData.movies.length)];
          
          // هم در Environment و هم به صورت موقت ست کن
          bru.setEnvVar("SearchedMovie", randomMovie.id);
          bru.setEnvVar("type", randomMovie.type);
          
          // برای اطمینان بیشتر
          bru.setVar("SearchedMovie", randomMovie.id);
          bru.setVar("type", randomMovie.type);
          
          console.log("Saved SearchedMovie =", randomMovie.id);
          console.log("Saved type =", randomMovie.type);
        } else {
          console.log("No movies found");
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
