info:
  name: View Search Movie
  type: http
  seq: 6

http:
  method: GET
  url: "{{Stage_VOD}}/api/v1/search/?q=b"
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9
    - name: authorization
      value: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..ySBU-cL1rDWFdTeKz1xbNQafXq4cbrzCLaRBfLWuGn9nkFE1rJjdNPF6MWTBqJtItktnavGFGq5MYUJf4U73uw
    - name: origin
      value: https://dotnama-stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotnama-stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
      value: ?0
    - name: sec-ch-ua-platform
      value: '"Windows"'
    - name: sec-fetch-dest
      value: empty
    - name: sec-fetch-mode
      value: cors
    - name: sec-fetch-site
      value: same-site
    - name: user-agent
      value: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36
  params:
    - name: q
      value: b
      type: query
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        const responseTime = res.getResponseTime();



        const jsonData = res.getBody();

        test("Search is done", () => {
          expect(res.status).to.equal(200);
          console.log("Search is done");
        });

        test("Response time is less than 500ms", () => {
          expect(res.responseTime).to.be.below(500);
        });

        if (jsonData && Array.isArray(jsonData.movies) && jsonData.movies.length > 0) {
          // Take the first item's id
          const SearchedMovie = jsonData.movies[Math.floor(Math.random() * jsonData.movies.length)].id;
          const type=jsonData.movies[Math.floor(Math.random() * jsonData.movies.length)].type;

          bru.setEnvVar("SearchedMovie", SearchedMovie);
          bru.setEnvVar("type", type);

          console.log("Search id is equal:", SearchedMovie);
          console.log("type is equal", type)
        } else {
          console.log("Response data missing required fields");
        }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
