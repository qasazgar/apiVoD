info:
  name: MovieSelection
  type: http
  seq: 3

http:
  method: post
  url: https://api-dotnama-stage.dpsb.ir/api/v1/panel/playlists/check/
  headers:
    - name: accept
      value: application/json, text/plain, */*
    - name: accept-language
      value: en-US,en;q=0.9,fa-IR;q=0.8,fa;q=0.7
    - name: authorization
      value: Bearer eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCJ9..FF8_hy-WiKG8zwYjc5xwcNOQk3Y0UB-PYefCGB4XEmnjAmqm4aONU4JNgU1L4tU-K9eOHQFuGDPSgQxNU4RSmQ
    - name: content-type
      value: application/json
    - name: origin
      value: https://dotnama-stage.dpsb.ir
    - name: priority
      value: u=1, i
    - name: referer
      value: https://dotnama-stage.dpsb.ir/
    - name: sec-ch-ua
      value: '"Chromium";v="152", "Not?A_Brand";v="24", "Google Chrome";v="152"'
    - name: sec-ch-ua-mobile
